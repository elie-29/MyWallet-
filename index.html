#app{position:relative; z-index:1;}
.serif{font-family:Georgia,"Times New Roman",serif;}
#app{max-width:480px; margin:0 auto; min-height:100%; display:flex; flex-direction:column; position:relative;}
header{padding:22px 20px 10px; }
header h1{font-size:22px; margin:0 0 2px; letter-spacing:.3px;}
header p{margin:0; color:var(--muted); font-size:14px;}
.screen{flex:1; padding:8px 16px 100px; overflow-x:hidden;}
.hidden{display:none !important;}
.grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:8px;}
.card{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; cursor:pointer;}
.card .emoji{font-size:22px;}
.card h3{margin:10px 0 2px; font-size:15px;}
.card p{margin:0; color:var(--muted); font-size:12px; line-height:1.4;}
.card.wide{grid-column:1 / -1;}
nav{position:fixed; bottom:0; left:0; right:0; max-width:480px; margin:0 auto; background:var(--card); border-top:1px solid var(--line); display:flex; padding:10px 6px calc(10px + env(safe-area-inset-bottom,0px));}
nav button{flex:1; background:none; border:none; color:var(--muted); font-size:11px; padding:6px 0; cursor:pointer;}
nav button.active{color:var(--gold);}
nav .ic{display:block; font-size:18px; margin-bottom:2px;}
.fab{position:fixed; right:20px; bottom:76px; max-width:480px; margin:0 auto; width:54px; height:54px; border-radius:50%; background:var(--gold); color:#151515; border:none; font-size:26px; box-shadow:0 6px 18px rgba(0,0,0,.4); cursor:pointer; z-index:5;}
.overlay{position:fixed; inset:0; background:rgba(0,0,0,.55); display:flex; align-items:flex-end; z-index:20;}
.sheet{background:var(--card); width:100%; max-width:480px; margin:0 auto; border-radius:20px 20px 0 0; padding:20px 20px calc(24px + env(safe-area-inset-bottom,0px)); max-height:85vh; overflow-y:auto;}
.sheet h2{margin:0 0 14px; font-size:18px;}
.row{display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--line); font-size:14px;}
.row:last-child{border-bottom:none;}
.big{font-size:34px; font-weight:600; margin:6px 0 2px;}
.muted{color:var(--muted);}
label{display:block; font-size:12px; color:var(--muted); margin:12px 0 4px;}
input,select{width:100%; background:var(--card2); border:1px solid var(--line); color:var(--text); padding:10px 12px; border-radius:10px; font-size:15px;}
.btn{width:100%; background:var(--gold); color:#151515; border:none; padding:13px; border-radius:12px; font-size:15px; font-weight:600; margin-top:16px; cursor:pointer;}
.btn.secondary{background:var(--card2); color:var(--text); border:1px solid var(--line);}
.btn.small{width:auto; padding:8px 14px; font-size:13px; margin-top:8px;}
.close{position:absolute; top:14px; right:16px; background:none; border:none; color:var(--muted); font-size:20px; cursor:pointer;}
.tx{display:flex; justify-content:space-between; padding:12px 0; border-bottom:1px solid var(--line);}
.tx .l small{display:block; color:var(--muted); font-size:11px; margin-top:2px;}
.amt.pos{color:var(--good);}
.amt.neg{color:var(--bad);}
.section-title{font-size:12px; text-transform:none; color:var(--muted); margin:18px 0 6px;}
.empty{color:var(--muted); font-size:13px; text-align:center; padding:30px 0;}
.warn{background:rgba(201,122,106,.12); border:1px solid var(--bad); color:var(--bad); padding:10px 12px; border-radius:10px; font-size:13px; margin-top:12px;}
.headrow{display:flex; align-items:center; gap:12px;}
.avatar{width:44px; height:44px; border-radius:50%; background:var(--card2); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:18px; color:var(--muted); overflow:hidden; flex-shrink:0;}
.avatar img{width:100%; height:100%; object-fit:cover;}
.avatar.big{width:74px; height:74px; font-size:26px;}
.reminder{background:var(--card2); border:1px solid var(--gold); border-radius:12px; padding:10px 12px; font-size:13px; margin-bottom:8px; display:flex; justify-content:space-between; gap:10px;}
.reminder b{color:var(--gold);}
#lock{position:fixed; inset:0; background:var(--bg); z-index:50; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px; text-align:center;}
#lock .dots{display:flex; gap:14px; margin:22px 0;}
#lock .dot{width:14px; height:14px; border-radius:50%; border:1px solid var(--line); background:var(--card2);}
#lock .dot.filled{background:var(--gold); border-color:var(--gold);}
.pad{display:grid; grid-template-columns:repeat(3,64px); gap:14px; margin-top:10px;}
.pad button{width:64px; height:64px; border-radius:50%; background:var(--card); border:1px solid var(--line); color:var(--text); font-size:20px; cursor:pointer;}
.faceBtn{margin-top:20px; background:none; border:1px solid var(--line); color:var(--gold); padding:12px 20px; border-radius:12px; font-size:14px; cursor:pointer;}
.toggle{display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px solid var(--line); font-size:14px;}
.switch{width:42px; height:24px; border-radius:12px; background:var(--card2); border:1px solid var(--line); position:relative; cursor:pointer; flex-shrink:0;}
.switch.on{background:var(--gold);}
.switch .knob{width:18px; height:18px; border-radius:50%; background:var(--text); position:absolute; top:2px; left:2px; transition:left .15s;}
.switch.on .knob{left:20px; background:#151515;}
</style>
</head>
<body>
<div id="bg"></div>
<div id="app">
  <header>
    <div class="headrow">
      <div class="avatar" id="headerAvatar">👤</div>
      <div>
        <h1 class="serif" id="headerTitle">My Wallet</h1>
        <p id="headerSub">Know your money. Control your money.</p>
      </div>
    </div>
  </header>
  <div class="screen" id="screen"></div>
  <button class="fab" onclick="openAdd()">+</button>
  <nav>
    <button class="navbtn active" data-tab="home" onclick="setTab('home')"><span class="ic">🏠</span>Home</button>
    <button class="navbtn" data-tab="diary" onclick="setTab('diary')"><span class="ic">📖</span>Diary</button>
    <button class="navbtn" data-tab="profile" onclick="setTab('profile')"><span class="ic">👤</span>Profile</button>
  </nav>
</div>
<div id="lock" class="hidden"></div>

<script>
const KEY='mywallet_v1';
function fresh(){return{
  name:'there',
  currency:'$',
  avatar:null,
  security:{enabled:false, pin:null, faceId:false},
  alloc:{savings:50,expenses:30,safeToSpend:10,tithe:10},
  buckets:{savings:0,expenses:0,safeToSpend:0},
  tithe:{due:0,paid:0},
  owedToYou:[], youOwe:[],
  txns:[], monthStamp: new Date().toISOString().slice(0,7),
  lastReminderNotify:null,
  lastModified: 0
};}
let S = JSON.parse(localStorage.getItem(KEY)||'null') || fresh();
if(!S.security || S.security.pin===undefined) S.security={enabled:false, pin:null, faceId:false};
if(S.avatar===undefined) S.avatar=null;
if(S.lastReminderNotify===undefined) S.lastReminderNotify=null;
if(S.lastModified===undefined) S.lastModified=0;
function save(){
  S.lastModified = Date.now();
  localStorage.setItem(KEY, JSON.stringify(S));
  cloudSave();
}
let cloudDoc=null, cloudReady=false;
function cloudSave(){
  if(!cloudDoc) return;
  cloudDoc.set(JSON.parse(JSON.stringify(S))).catch(()=>{ /* offline or unavailable, localStorage still has it */ });
}
async function initCloud(){
  try{
    const db = await claude.use('db');
    const user = await claude.use('user');
    if(!db || !user) return;
    const uid = await user.id();
    if(!uid) return;
    cloudDoc = db.doc('data/users/'+uid+'/wallet');
    const snap = await cloudDoc.get();
    const cloudData = snap.exists ? snap.data() : null;
    if(cloudData && cloudData.txns && (cloudData.lastModified||0) > (S.lastModified||0)){
      S = cloudData;
      if(!S.security || S.security.pin===undefined) S.security={enabled:false, pin:null, faceId:false};
      if(S.avatar===undefined) S.avatar=null;
      localStorage.setItem(KEY, JSON.stringify(S));
      if(!(S.security.enabled && S.security.pin)) render();
    } else {
      cloudSave();
    }
    cloudReady = true;
  }catch(e){ /* no cloud in this view; localStorage keeps working alone */ }
}
function totalOf(list){ return list.reduce((s,d)=>s+d.amount,0); }
function fmt(n){ return S.currency + (Math.round(n*100)/100).toFixed(2); }
function now(){ return new Date(); }
function pushTx(t){ t.date=now().toLocaleDateString(undefined,{day:'2-digit',month:'short'}); t.time=now().toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'}); S.txns.unshift(t); }

function checkRollover(){
  const cur = now().toISOString().slice(0,7);
  if(cur !== S.monthStamp){
    const leftover = S.buckets.expenses;
    if(leftover > 0){
      S.buckets.savings += leftover;
      pushTx({type:'Expense rollover', desc:(S.monthStamp||'Previous month')+' leftover', amount:leftover, sign:1, dest:'Savings'});
    }
    S.buckets.expenses = 0;
    S.monthStamp = cur;
    save();
  }
}
checkRollover();

function daysUntil(iso){
  if(!iso) return null;
  const d = new Date(iso+'T00:00:00'); const t = new Date(); t.setHours(0,0,0,0);
  return Math.round((d-t)/86400000);
}
function dueLabel(iso){
  const n = daysUntil(iso);
  if(n===null) return '';
  if(n<0) return `${Math.abs(n)}d overdue`;
  if(n===0) return 'due today';
  if(n===1) return 'due tomorrow';
  return `due in ${n}d`;
}
function getReminders(){
  const items=[];
  S.youOwe.forEach(d=>{ if(d.amount>0 && d.due){ const n=daysUntil(d.due); if(n<=3) items.push({dir:'youOwe', name:d.name, amount:d.amount, n, label:dueLabel(d.due)}); }});
  S.owedToYou.forEach(d=>{ if(d.amount>0 && d.expected){ const n=daysUntil(d.expected); if(n<=3) items.push({dir:'owedToYou', name:d.name, amount:d.amount, n, label:dueLabel(d.expected)}); }});
  items.sort((a,b)=>a.n-b.n);
  return items;
}
function remindersHTML(){
  const items = getReminders();
  if(!items.length) return '';
  return items.map(it=>`<div class="reminder"><span>${it.dir==='youOwe'?'You owe '+it.name:it.name+' owes you'} <b>${fmt(it.amount)}</b></span><span class="${it.n<0?'muted':''}" style="color:${it.n<=0?'var(--bad)':'var(--gold)'}">${it.label}</span></div>`).join('');
}
function tryNotify(){
  try{
    const items = getReminders();
    const today = new Date().toISOString().slice(0,10);
    if(items.length && S.lastReminderNotify!==today && 'Notification' in window && Notification.permission==='granted'){
      new Notification('My Wallet reminder', {body: items.slice(0,3).map(it=> (it.dir==='youOwe'?'You owe '+it.name:it.name+' owes you')+' '+fmt(it.amount)+' — '+it.label).join('\n')});
      S.lastReminderNotify = today; save();
    }
  }catch(e){ /* notifications unavailable in this environment */ }
}
function enableNotifications(){
  try{
    if(!('Notification' in window)){ alert('Notifications are not supported in this browser.'); return; }
    Notification.requestPermission().then(p=>{ if(p==='granted'){ tryNotify(); render(); } });
  }catch(e){ alert('Notifications are not available here.'); }
}

let tab='home';
function setTab(t){ tab=t; document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active', b.dataset.tab===t)); render(); }

function render(){
  document.getElementById('headerTitle').textContent = tab==='home' ? 'My Wallet' : tab==='diary' ? 'Money Diary' : 'Profile';
  document.getElementById('headerSub').textContent = tab==='home' ? 'Good day, '+S.name : tab==='diary' ? 'Every movement, recorded' : 'Settings & rules';
  const el = document.getElementById('screen');
  const av = document.getElementById('headerAvatar');
  av.innerHTML = S.avatar ? `<img src="${S.avatar}">` : '👤';
  if(tab==='home') el.innerHTML = homeHTML();
  if(tab==='diary') el.innerHTML = diaryHTML();
  if(tab==='profile') el.innerHTML = profileHTML();
}

function homeHTML(){
  return `${remindersHTML()}<div class="grid">
    <div class="card" onclick="openBucket('savings')"><div class="emoji">🏦</div><h3>Savings</h3><p>Protected money</p></div>
    <div class="card" onclick="openBucket('expenses')"><div class="emoji">💳</div><h3>Expenses</h3><p>Monthly reserve</p></div>
    <div class="card" onclick="openBucket('safeToSpend')"><div class="emoji">🟢</div><h3>Safe to Spend</h3><p>Discretionary money</p></div>
    <div class="card" onclick="openBucket('tithe')"><div class="emoji">❤️</div><h3>Tithe</h3><p>Reserved giving</p></div>
    <div class="card" onclick="openBucket('youOwe')"><div class="emoji">🤝</div><h3>You Owe</h3><p>What you're paying back</p></div>
    <div class="card" onclick="openBucket('owedToYou')"><div class="emoji">💸</div><h3>Owed to You</h3><p>Not counted until received</p></div>
  </div>`;
}

function diaryHTML(){
  if(!S.txns.length) return '<div class="empty">No transactions yet. Tap + to add one.</div>';
  return S.txns.map(t=>`<div class="tx"><div class="l"><div>${t.type}${t.desc? ' — '+t.desc:''}</div><small>${t.date} · ${t.time}${t.dest? ' · → '+t.dest:''}${t.src? ' · from '+t.src:''}</small></div><div class="amt ${t.sign>0?'pos':'neg'}">${t.sign>0?'+':'-'}${fmt(Math.abs(t.amount))}</div></div>`).join('');
}

function profileHTML(){
  const a = S.alloc; const sec = S.security;
  return `
  <div class="section-title">Photo</div>
  <div class="headrow">
    <div class="avatar big">${S.avatar? `<img src="${S.avatar}">` : '👤'}</div>
    <div>
      <input type="file" id="photoInput" accept="image/*" style="display:none" onchange="onPhotoChosen(event)">
      <button class="btn small" onclick="document.getElementById('photoInput').click()">Change photo</button>
      ${S.avatar? `<button class="btn small secondary" onclick="S.avatar=null; save(); render();">Remove</button>`:''}
    </div>
  </div>
  <div class="section-title">Personal</div>
  <label>Name</label><input id="pName" value="${S.name}">
  <label>Currency symbol</label><input id="pCur" value="${S.currency}">
  <div class="section-title">Allocation percentages (must total 100)</div>
  <label>Savings %</label><input id="aS" type="number" value="${a.savings}">
  <label>Expenses %</label><input id="aE" type="number" value="${a.expenses}">
  <label>Safe to Spend %</label><input id="aF" type="number" value="${a.safeToSpend}">
  <label>Tithe %</label><input id="aT" type="number" value="${a.tithe}">
  <div id="allocErr"></div>
  <button class="btn" onclick="saveProfile()">Save settings</button>

  <div class="section-title">App Security</div>
  <div class="toggle"><span>App lock (PIN)</span><div class="switch ${sec.enabled?'on':''}" onclick="toggleLock()"><div class="knob"></div></div></div>
  ${sec.enabled? `<button class="btn small secondary" onclick="changePin()">Change PIN</button>` : ''}
  ${sec.enabled? `<div class="toggle"><span>Simulate Face ID unlock</span><div class="switch ${sec.faceId?'on':''}" onclick="toggleFaceId()"><div class="knob"></div></div></div>
    <p class="muted" style="font-size:12px;margin-top:-4px">Prototype only — no real biometric data is read. PIN remains the fallback.</p>` : ''}

  <div class="section-title">Reminders</div>
  <button class="btn small secondary" onclick="enableNotifications()">Enable due-date notifications</button>
  <p class="muted" style="font-size:12px">Also shown as a banner on Home whenever something is due within 3 days.</p>

  <div class="section-title">Backup</div>
  <p class="muted" style="font-size:12px;margin-top:-4px">Your data auto-saves to a private cloud copy tied to your account whenever you're online, and to this browser always. Export gives you your own copy too.</p>
  <button class="btn small secondary" onclick="exportBackup()">Export backup file</button>
  <input type="file" id="importInput" accept="application/json" style="display:none" onchange="importBackup(event)">
  <button class="btn small secondary" onclick="document.getElementById('importInput').click()">Import backup file</button>

  <div class="section-title">Data</div>
  <button class="btn secondary" onclick="if(confirm('Reset all data? This cannot be undone.')){S=fresh();save();render();}">Reset all data</button>
  `;
}
async function exportBackup(){
  const data = JSON.stringify(S, null, 2);
  try{
    const downloads = await claude.use('downloads');
    if(downloads){ await downloads.save({filename:'my-wallet-backup.json', data}); return; }
  }catch(e){}
  alert('Downloads are not available in this view. Copy this instead:\n\n'+data.slice(0,500)+(data.length>500?'...':''));
}
function importBackup(e){
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const parsed = JSON.parse(reader.result);
      if(!parsed.txns || !parsed.buckets) throw new Error('bad file');
      if(!confirm('Replace current data with this backup?')) return;
      S = parsed;
      if(!S.security || S.security.pin===undefined) S.security={enabled:false, pin:null, faceId:false};
      if(S.avatar===undefined) S.avatar=null;
      save(); render();
    }catch(err){ alert("That file doesn't look like a My Wallet backup."); }
  };
  reader.readAsText(file);
}
function onPhotoChosen(e){
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    const img = new Image();
    img.onload = ()=>{
      const size=200; const c=document.createElement('canvas'); c.width=size; c.height=size;
      const ctx=c.getContext('2d');
      const s = Math.max(size/img.width, size/img.height);
      const w=img.width*s, h=img.height*s;
      ctx.drawImage(img,(size-w)/2,(size-h)/2,w,h);
      S.avatar = c.toDataURL('image/jpeg',0.85);
      save(); render();
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}
function toggleLock(){
  if(!S.security.enabled){
    modal(`<button class="close" onclick="closeModal()">✕</button>
      <h2>Set a 4-digit PIN</h2>
      <label>New PIN</label><input id="newPin" type="password" inputmode="numeric" maxlength="4">
      <div id="credErr"></div>
      <button class="btn" onclick="savePin()">Save PIN</button>
    `);
  } else {
    if(confirm('Turn off app lock?')){ S.security.enabled=false; S.security.pin=null; S.security.faceId=false; save(); render(); }
  }
}
function changePin(){
  modal(`<button class="close" onclick="closeModal()">✕</button>
    <h2>Change PIN</h2>
    <label>New PIN</label><input id="newPin" type="password" inputmode="numeric" maxlength="4">
    <div id="credErr"></div>
    <button class="btn" onclick="savePin()">Save PIN</button>
  `);
}
function savePin(){
  const p=document.getElementById('newPin').value;
  if(!/^\d{4}$/.test(p)){ document.getElementById('credErr').innerHTML='<div class="warn">Enter exactly 4 digits.</div>'; return; }
  S.security.pin=p; S.security.enabled=true; save(); closeModal(); render();
}
function toggleFaceId(){ S.security.faceId = !S.security.faceId; save(); render(); }
function saveProfile(){
  const s=+document.getElementById('aS').value, e=+document.getElementById('aE').value, f=+document.getElementById('aF').value, t=+document.getElementById('aT').value;
  if(s+e+f+t !== 100){ document.getElementById('allocErr').innerHTML='<div class="warn">Allocation must total 100%. Currently: '+(s+e+f+t)+'%</div>'; return; }
  S.name=document.getElementById('pName').value||'there';
  S.currency=document.getElementById('pCur').value||'$';
  S.alloc={savings:s,expenses:e,safeToSpend:f,tithe:t};
  save(); render();
}

function modal(html){
  const o=document.createElement('div'); o.className='overlay'; o.id='ovl';
  o.innerHTML = `<div class="sheet" style="position:relative">${html}</div>`;
  o.addEventListener('click', e=>{ if(e.target===o) closeModal(); });
  document.body.appendChild(o);
}
function closeModal(){ const o=document.getElementById('ovl'); if(o) o.remove(); }

function openBucket(key){
  if(key==='savings'||key==='expenses'||key==='safeToSpend'){
    const label={savings:'Savings',expenses:'Expenses',safeToSpend:'Safe to Spend'}[key];
    const hist = S.txns.filter(t=>t.dest===label || t.src===label || t.type.toLowerCase().includes(label.toLowerCase()));
    let extra='';
    if(key==='expenses'){
      extra = `<button class="btn small secondary" onclick="manualRollover()">Move leftover into Savings</button>`;
    }
    if(key==='safeToSpend'){
      extra = `<button class="btn small secondary" onclick="manualRolloverSafe()">Move leftover into Savings</button>`;
    }
    modal(`<button class="close" onclick="closeModal()">✕</button>
      <h2>${label}</h2>
      <div class="big">${fmt(S.buckets[key])}</div>
      <div class="muted">Current balance</div>
      ${extra}
      <div class="section-title">History</div>
      ${hist.length? hist.map(t=>`<div class="tx"><div class="l"><div>${t.type}${t.desc?' — '+t.desc:''}</div><small>${t.date}</small></div><div class="amt ${t.sign>0?'pos':'neg'}">${t.sign>0?'+':'-'}${fmt(Math.abs(t.amount))}</div></div>`).join('') : '<div class="empty">No history yet</div>'}
    `);
  }
  if(key==='tithe'){
    modal(`<button class="close" onclick="closeModal()">✕</button>
      <h2>Tithe</h2>
      <div class="big">${fmt(S.tithe.due)}</div>
      <div class="muted">Currently due</div>
      ${S.tithe.due>0? `<button class="btn small" onclick="markTithePaid()">Mark as paid</button>`:''}
      <div class="section-title">History</div>
      ${S.txns.filter(t=>t.type.toLowerCase().includes('tithe')).map(t=>`<div class="tx"><div class="l"><div>${t.type}${t.desc?' — '+t.desc:''}</div><small>${t.date}</small></div><div class="amt ${t.sign>0?'pos':'neg'}">${t.sign>0?'+':'-'}${fmt(Math.abs(t.amount))}</div></div>`).join('') || '<div class="empty">No history yet</div>'}
    `);
  }
  if(key==='youOwe'){
    modal(`<button class="close" onclick="closeModal()">✕</button>
      <h2>You Owe</h2>
      <div class="big">${fmt(totalOf(S.youOwe))}</div><div class="muted">Total you owe</div>
      ${S.youOwe.length? S.youOwe.map(d=>`<div class="row"><div>${d.name}${d.due?'<br><small class="muted">'+dueLabel(d.due)+'</small>':''}</div><div>${fmt(d.amount)} ${d.amount>0?`<button class="btn small" style="margin-left:8px;display:inline-block;width:auto" onclick="payDebt('${d.id}')">Pay</button>`:'<span class="muted">Paid</span>'}</div></div>`).join('') : '<div class="empty">Nobody yet. Add one below.</div>'}
      <button class="btn secondary" onclick="closeModal(); openAddDebt('youOwe')">Add debt</button>
    `);
  }
  if(key==='owedToYou'){
    modal(`<button class="close" onclick="closeModal()">✕</button>
      <h2>Owed to You</h2>
      <div class="big">${fmt(totalOf(S.owedToYou))}</div><div class="muted">Total owed to you</div>
      <p class="muted" style="font-size:12px;margin-top:6px">Not counted as available money until received.</p>
      ${S.owedToYou.length? S.owedToYou.map(d=>`<div class="row"><div>${d.name}${d.expected?'<br><small class="muted">'+dueLabel(d.expected)+'</small>':''}</div><div>${fmt(d.amount)} ${d.amount>0?`<button class="btn small" style="margin-left:8px;display:inline-block;width:auto" onclick="receiveDebt('${d.id}')">Receive</button>`:'<span class="muted">Settled</span>'}</div></div>`).join('') : '<div class="empty">Nobody yet. Add one below.</div>'}
      <button class="btn secondary" onclick="closeModal(); openAddDebt('owedToYou')">Add person who owes you</button>
    `);
  }
}

function manualRollover(){
  const amt = S.buckets.expenses;
  if(amt<=0){ alert('No expense reserve available to move.'); return; }
  S.buckets.savings += amt;
  pushTx({type:'Expense rollover', desc:'Manual', amount:amt, sign:1, dest:'Savings'});
  S.buckets.expenses = 0;
  save(); closeModal(); openBucket('expenses');
}
function manualRolloverSafe(){
  const amt = S.buckets.safeToSpend;
  if(amt<=0){ alert('No Safe to Spend balance available to move.'); return; }
  S.buckets.savings += amt;
  pushTx({type:'Safe to Spend rollover', desc:'Manual', amount:amt, sign:-1, src:'Safe to Spend'});
  pushTx({type:'Safe to Spend rollover', desc:'Manual', amount:amt, sign:1, dest:'Savings'});
  S.buckets.safeToSpend = 0;
  save(); closeModal(); openBucket('safeToSpend');
}
function markTithePaid(){
  const amt = S.tithe.due;
  pushTx({type:'Tithe payment', amount:amt, sign:-1, src:'Tithe'});
  S.tithe.due = 0;
  save(); closeModal(); openBucket('tithe');
}

function openAddDebt(kind){
  const isOwe = kind==='youOwe';
  modal(`<button class="close" onclick="closeModal()">✕</button>
    <h2>${isOwe?'Add debt you owe':'Add someone who owes you'}</h2>
    <label>Person</label><input id="dName">
    <label>Amount</label><input id="dAmt" type="number">
    <label>${isOwe?'Due date (optional)':'Expected date (optional)'}</label><input id="dDate" type="date">
    <button class="btn" onclick="saveDebt('${kind}')">Save</button>
  `);
}
function saveDebt(kind){
  const name=document.getElementById('dName').value.trim();
  const amount=+document.getElementById('dAmt').value;
  const date=document.getElementById('dDate').value.trim();
  if(!name||!amount||amount<=0) return alert('Enter a name and amount.');
  const rec = {id:crypto.randomUUID(), name, amount};
  if(kind==='youOwe'){ rec.due=date; S.youOwe.push(rec); }
  else { rec.expected=date; S.owedToYou.push(rec); }
  save(); closeModal(); openBucket(kind);
}

function payDebt(id){
  const d = S.youOwe.find(x=>x.id===id); if(!d) return;
  if(S.buckets.savings < d.amount){
    modal(`<button class="close" onclick="closeModal()">✕</button>
      <h2>Savings insufficient</h2>
      <div class="warn">Available in Savings: ${fmt(S.buckets.savings)}<br>Required: ${fmt(d.amount)}<br>Shortfall: ${fmt(d.amount-S.buckets.savings)}</div>
      ${S.buckets.savings>0? `<button class="btn" onclick="partialPay('${id}')">Pay ${fmt(S.buckets.savings)} now</button>`:''}
      <button class="btn secondary" onclick="closeModal()">Cancel</button>
    `);
    return;
  }
  S.buckets.savings -= d.amount;
  pushTx({type:'Debt payment', desc:d.name, amount:d.amount, sign:-1, src:'Savings'});
  d.amount = 0;
  save(); closeModal(); openBucket('youOwe');
}
function partialPay(id){
  const d = S.youOwe.find(x=>x.id===id); if(!d) return;
  const pay = S.buckets.savings;
  S.buckets.savings = 0;
  d.amount -= pay;
  pushTx({type:'Debt payment', desc:d.name+' (partial)', amount:pay, sign:-1, src:'Savings'});
  save(); closeModal(); openBucket('youOwe');
}
function receiveDebt(id){
  const d = S.owedToYou.find(x=>x.id===id); if(!d) return;
  S.buckets.savings += d.amount;
  pushTx({type:'Debt repayment received', desc:d.name, amount:d.amount, sign:1, dest:'Savings'});
  d.amount = 0;
  save(); closeModal(); openBucket('owedToYou');
}

function openAdd(){
  modal(`<button class="close" onclick="closeModal()">✕</button>
    <h2>Add transaction</h2>
    <label>Type</label>
    <select id="txType" onchange="renderTxFields()">
      <option value="salary">Salary</option>
      <option value="savings">Savings</option>
      <option value="expense">Expense</option>
      <option value="safe">Safe to Spend</option>
      <option value="debtReceived">Debt repayment received</option>
      <option value="debtPayment">Debt payment</option>
    </select>
    <div id="txFields"></div>
    <div id="txErr"></div>
    <button class="btn" onclick="submitTx()">Add</button>
  `);
  renderTxFields();
}
function renderTxFields(){
  const t = document.getElementById('txType').value;
  const f = document.getElementById('txFields');
  if(t==='salary') f.innerHTML = `<label>Salary amount</label><input id="fAmt" type="number">`;
  if(t==='savings') f.innerHTML = `<label>Amount</label><input id="fAmt" type="number"><label>Note (optional)</label><input id="fNote" placeholder="e.g. Gift, bonus, manual top-up">`;
  if(t==='expense') f.innerHTML = `<label>Category</label><input id="fCat" placeholder="Groceries, Transport...">
    <label>Amount</label><input id="fAmt" type="number"><label>Note (optional)</label><input id="fNote">`;
  if(t==='safe') f.innerHTML = `<label>Amount</label><input id="fAmt" type="number"><label>Note (optional)</label><input id="fNote">`;
  if(t==='debtReceived'){
    const opts = S.owedToYou.filter(d=>d.amount>0);
    f.innerHTML = opts.length? `<label>From</label><select id="fPerson">${opts.map(d=>`<option value="${d.id}">${d.name} (owes ${fmt(d.amount)})</option>`).join('')}</select><label>Amount received</label><input id="fAmt" type="number">` : `<p class="muted" style="font-size:13px">No one owes you yet. Add them from the "Owed to You" card first.</p>`;
  }
  if(t==='debtPayment'){
    const opts = S.youOwe.filter(d=>d.amount>0);
    f.innerHTML = opts.length? `<label>To</label><select id="fPerson">${opts.map(d=>`<option value="${d.id}">${d.name} (${fmt(d.amount)} owed)</option>`).join('')}</select><label>Amount to pay</label><input id="fAmt" type="number">` : `<p class="muted" style="font-size:13px">You don't owe anyone yet. Add them from the "You Owe" card first.</p>`;
  }
}
function submitTx(){
  const t = document.getElementById('txType').value;
  const err = document.getElementById('txErr'); err.innerHTML='';
  if(t==='salary'){
    const amt = +document.getElementById('fAmt').value;
    if(!amt||amt<=0) return;
    const a = S.alloc;
    const sSav = amt*a.savings/100, sExp = amt*a.expenses/100, sSafe = amt*a.safeToSpend/100, sTith = amt*a.tithe/100;
    S.buckets.savings += sSav; S.buckets.expenses += sExp; S.buckets.safeToSpend += sSafe; S.tithe.due += sTith;
    pushTx({type:'Salary received', amount:amt, sign:1});
    pushTx({type:'Salary allocation', desc:'Savings', amount:sSav, sign:1, dest:'Savings'});
    pushTx({type:'Salary allocation', desc:'Expenses', amount:sExp, sign:1, dest:'Expenses'});
    pushTx({type:'Salary allocation', desc:'Safe to Spend', amount:sSafe, sign:1, dest:'Safe to Spend'});
    pushTx({type:'Salary allocation', desc:'Tithe', amount:sTith, sign:1, dest:'Tithe'});
  }
  if(t==='savings'){
    const amt = +document.getElementById('fAmt').value, note=document.getElementById('fNote').value;
    if(!amt||amt<=0) return;
    S.buckets.savings += amt;
    pushTx({type:'Savings', desc:note, amount:amt, sign:1, dest:'Savings'});
  }
  if(t==='expense'){
    const amt = +document.getElementById('fAmt').value, cat=document.getElementById('fCat').value||'Expense', note=document.getElementById('fNote').value;
    if(!amt||amt<=0) return;
    S.buckets.expenses -= amt;
    pushTx({type:cat, desc:note, amount:amt, sign:-1, src:'Expenses'});
  }
  if(t==='safe'){
    const amt = +document.getElementById('fAmt').value, note=document.getElementById('fNote').value;
    if(!amt||amt<=0) return;
    S.buckets.safeToSpend -= amt;
    pushTx({type:'Discretionary spend', desc:note, amount:amt, sign:-1, src:'Safe to Spend'});
  }
  if(t==='debtReceived'){
    const sel = document.getElementById('fPerson'); if(!sel) return closeModal();
    const d = S.owedToYou.find(x=>x.id===sel.value);
    const amt = Math.min(+document.getElementById('fAmt').value, d.amount);
    if(!amt||amt<=0) return;
    S.buckets.savings += amt; d.amount -= amt;
    pushTx({type:'Debt repayment received', desc:d.name, amount:amt, sign:1, dest:'Savings'});
  }
  if(t==='debtPayment'){
    const sel = document.getElementById('fPerson'); if(!sel) return closeModal();
    const d = S.youOwe.find(x=>x.id===sel.value);
    let amt = +document.getElementById('fAmt').value;
    if(!amt||amt<=0) return;
    if(amt > S.buckets.savings){ err.innerHTML = `<div class="warn">Savings insufficient. Available: ${fmt(S.buckets.savings)}, required: ${fmt(amt)}.</div>`; return; }
    if(amt > d.amount) amt = d.amount;
    S.buckets.savings -= amt; d.amount -= amt;
    pushTx({type:'Debt payment', desc:d.name, amount:amt, sign:-1, src:'Savings'});
  }
  save(); closeModal(); render();
}

let pinEntry='';
function showLock(){
  document.getElementById('app').classList.add('hidden');
  const l = document.getElementById('lock'); l.classList.remove('hidden');
  pinEntry='';
  l.innerHTML = `
    <div class="avatar big">${S.avatar? `<img src="${S.avatar}">`:'🔒'}</div>
    <h2 class="serif" style="margin:16px 0 0">My Wallet</h2>
    <p class="muted">Enter your PIN to continue</p>
    <div class="dots" id="pinDots">${[0,1,2,3].map(()=>'<div class="dot"></div>').join('')}</div>
    <div class="pad">
      ${[1,2,3,4,5,6,7,8,9].map(n=>`<button onclick="pinPress('${n}')">${n}</button>`).join('')}
      <div></div><button onclick="pinPress('0')">0</button><button onclick="pinPress('back')">⌫</button>
    </div>
    ${S.security.faceId? `<button class="faceBtn" onclick="unlockFace()">🙂 Use Face ID</button>` : ''}
    <div id="lockErr"></div>
  `;
}
function pinPress(k){
  const err=document.getElementById('lockErr');
  if(k==='back'){ pinEntry = pinEntry.slice(0,-1); }
  else if(pinEntry.length<4){ pinEntry += k; }
  document.querySelectorAll('#pinDots .dot').forEach((d,i)=> d.classList.toggle('filled', i<pinEntry.length));
  if(pinEntry.length===4){
    if(pinEntry===S.security.pin){ unlock(); }
    else { err.innerHTML = '<div class="warn" style="margin-top:16px">Incorrect PIN. Try again.</div>'; pinEntry=''; setTimeout(()=>document.querySelectorAll('#pinDots .dot').forEach(d=>d.classList.remove('filled')),300); }
  }
}
function unlockFace(){ unlock(); }
function unlock(){
  document.getElementById('lock').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  render(); tryNotify();
}
if(S.security.enabled && S.security.pin){ showLock(); } else { render(); tryNotify(); }
initCloud();
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
</script>
